
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="480"
     viewBox="0 0 1600 480"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Mary Olarewaju — AI and Machine Learning Engineer</title>
  <desc id="desc">Engineering intelligent systems, software and infrastructure.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#101D2D"/>
      <stop offset="100%" stop-color="#0B1722"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none"
            stroke="#94A3B8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="480" fill="url(#background)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>

  <!-- Ambient light -->
  <circle cx="1330" cy="210" r="310" fill="#0E7490" opacity="0.09"/>
  <circle cx="1450" cy="390" r="220" fill="#2DD4BF" opacity="0.055"/>

  <!-- Architectural connection lines -->
  <g fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5">
    <path d="M1040 80H1220V170H1390V90H1530"/>
    <path d="M1080 350H1210V270H1370V350H1530"/>
    <path d="M1180 170V270"/>
    <path d="M1390 90V170H1510V270"/>
    <path d="M1220 170H1320V110"/>
    <path d="M1210 270H1100V390H1450V350"/>
  </g>

  <!-- Architecture nodes -->
  <g fill="#0B1220" stroke="#2DD4BF" stroke-width="2">
    <circle cx="1220" cy="170" r="6"/>
    <circle cx="1390" cy="90" r="6"/>
    <circle cx="1390" cy="170" r="6"/>
    <circle cx="1210" cy="270" r="6"/>
    <circle cx="1370" cy="350" r="6"/>
    <circle cx="1180" cy="170" r="5"/>
    <circle cx="1180" cy="270" r="5"/>
  </g>

  <g fill="#38BDF8">
    <circle cx="1530" cy="90" r="4"/>
    <circle cx="1530" cy="270" r="4"/>
    <circle cx="1450" cy="390" r="4"/>
  </g>

  <!-- Right-side structural frame -->
  <rect x="1060" y="48" width="470" height="360"
        rx="16" fill="none"
        stroke="#64748B" stroke-opacity="0.18"/>

  <path d="M1060 110H1530" stroke="#64748B" stroke-opacity="0.13"/>
  <path d="M1060 350H1530" stroke="#64748B" stroke-opacity="0.13"/>

  <text x="1090" y="85" fill="#64748B"
        font-family="monospace" font-size="12"
        letter-spacing="3">SYSTEMS / ARCHITECTURE</text>

  <rect x="0" y="0" width="1600" height="480" fill="url(#fade)"/>

  <!-- Main identity -->
  <text x="100" y="125"
        fill="#5EEAD4"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="600"
        letter-spacing="5">ENGINEERING / AI / SYSTEMS</text>

  <text x="96" y="225"
        fill="#F8FAFC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="76"
        font-weight="700"
        letter-spacing="-2">Mary Olarewaju</text>

  <rect x="100" y="263" width="72" height="4" rx="2"
        fill="url(#accent)"/>

  <text x="100" y="315"
        fill="#E2E8F0"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27"
        font-weight="600">AI &amp; Machine Learning Engineer</text>

  <text x="100" y="358"
        fill="#94A3B8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21">Software Engineering · Intelligent Systems · Infrastructure</text>

  <text x="100" y="416"
        fill="#5EEAD4"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        letter-spacing="1.2">ENGINEERING INTELLIGENT SYSTEMS. BUILDING FOR THE REAL WORLD.</text>

  <!-- Bottom accent -->
  <rect x="0" y="474" width="1600" height="6" fill="url(#accent)"/>

</svg>
